title: "Mary Ellen Chaffin"
description: "Frontend engineer and UX architect. Case studies, resume, and real life."
author: "Mary Ellen Chaffin"
email: "mechaffin@gmail.com"
url: "https://mechaffin.github.io"
baseurl: ""
timezone: "America/Los_Angeles"
lang: "en"

# Theme
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/
excerpt_separator: "<!-- more -->"

# Collections
collections:
  case_studies:
    output: true
    permalink: /writing/:path/

defaults:
  - scope:
      path: ""
      type: case_studies
    values:
      layout: case-study

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - _archive
  - node_modules
  - package.json
  - package-lock.json

# Social links and theme options (minima)
minima:
  skin: classic
  social_links:
    - platform: github
      icon: github
      user_url: "https://github.com/alster-built"
    - platform: linkedin
      icon: linkedin
      user_url: "https://linkedin.com/in/mechaffin"

# Legacy social usernames for Minima (improves compatibility)
github_username: mechaffin
linkedin_username: mechaffin

# Dates rendered consistently site-wide
date_format: "%Y-%m-%d"

# Control which pages appear in the top navigation
# (index.md is intentionally omitted — the site title in the header already links home)
header_pages:
  - alster-basenjis.md
